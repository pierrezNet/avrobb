# Vérifications à chaque envoi et demande de fusion ; sur main, migrations de la base D1 distante
# puis déploiement du Worker. Secrets du dépôt : CLOUDFLARE_API_TOKEN (jeton limité à ce compte :
# Workers Scripts, D1, Workers R2 Storage en écriture), CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint (Biome), types, tests rapides.
      - run: npm run check
      # Repositories sur une D1 locale neuve (Miniflare).
      - run: npm run test:db

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environnement GitHub « production » : secrets propres, et approbation possible avant déploiement.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migrations d'abord : elles doivent rester compatibles avec la version en ligne (ajouter, puis
      # retirer dans un déploiement suivant).
      - run: npx wrangler d1 migrations apply avrobb --remote
      - run: npm run deploy
